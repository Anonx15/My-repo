name: Build optimized nwg-dock

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on Arch Linux (x86-64-v2)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm gcc base-devel go git gtk3 gtk-layer-shell

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: nwg-piotr/nwg-dock
          path: nwg-dock
          fetch-depth: 0

      - name: Extract version
        working-directory: nwg-dock
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' main.go)
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --always 2>/dev/null || echo "unknown")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build with optimized flags
        working-directory: nwg-dock
        run: |
          mkdir -p bin
          export CGO_ENABLED=1
          export CGO_CFLAGS="-O3 -march=x86-64-v2 -pipe -ffunction-sections -fdata-sections"
          export CGO_LDFLAGS="-Wl,-O2 -Wl,--as-needed -Wl,--gc-sections -Wl,-z,relro -Wl,-z,now -Wno-deprecated-declarations"
          export GOAMD64=v2
          go build -v -trimpath -buildmode=pie -ldflags="-s -w -linkmode=external" -o bin/nwg-dock .

      - name: Check binary type
        working-directory: nwg-dock
        run: file bin/nwg-dock
      
      - name: Show binary size
        working-directory: nwg-dock
        run: ls -lh bin/nwg-dock

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nwg-dock-${{ env.VERSION }}-x86-64-v2
          path: nwg-dock/bin/nwg-dock

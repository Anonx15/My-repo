name: Build Ghostty RPM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ghostty-rpm
  cancel-in-progress: true

env:
  GHOSTTY_VERSION: "1.4.0"
  GHOSTTY_REF: "83fb95624b0439ee660c2679b43b38c8b63769cd" # tag v1.4.0
  ZIG_VERSION: "0.17.1"
  ZIG_SHA256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"

jobs:
  build:
    name: Build Ghostty RPM (Fedora 45 / KDE Plasma)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c # Fedora 45

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: myrepo
          persist-credentials: false

      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            wget \
            xz \
            tar \
            rpm-build \
            systemd-rpm-macros \
            gtk4-devel \
            libadwaita-devel \
            gtk4-layer-shell-devel \
            libglvnd-devel \
            fontconfig-devel \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            gettext \
            blueprint-compiler \
            pkgconf-pkg-config \
            ncurses

      - name: Download Zig
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          wget --https-only --tries=3 -q \
            "https://ziglang.org/download/${ZIG_VERSION}/${archive}" \
            -O "${archive}"
          echo "${ZIG_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xf "${archive}"
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Checkout Ghostty
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ghostty-org/ghostty
          ref: ${{ env.GHOSTTY_REF }}
          path: ghostty
          persist-credentials: false

      - name: Build Ghostty
        working-directory: ghostty
        run: |
          zig version
          zig build \
            -Doptimize=ReleaseFast \
            -Dcpu=bdver2 \
            -Dpie=true \
            -Dstrip=true \
            -Dversion-string="${GHOSTTY_VERSION}" \
            -Dinstalled-exe-path=/usr/bin/ghostty \
            -Dfont-backend=fontconfig_freetype \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Drenderer=opengl \
            -Demit-docs=false \
            -Di18n=false \
            -fsys=fontconfig \
            -fsys=gtk4-layer-shell \
            -p "$PWD/output"

      - name: Show build output structure
        run: find ghostty/output -type f | sort

      - name: Prepare rpmbuild tree and sources
        run: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp myrepo/Packaging/rpm/ghostty/ghostty.spec rpmbuild/SPECS/ghostty.spec
          cp -a ghostty/output rpmbuild/SOURCES/output

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_topdir ${{ github.workspace }}/rpmbuild" \
            --define "_sourcedir ${{ github.workspace }}/rpmbuild/SOURCES" \
            rpmbuild/SPECS/ghostty.spec

      - name: Upload RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostty-${{ env.GHOSTTY_VERSION }}-fc45-bdver2.rpm
          path: rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 15

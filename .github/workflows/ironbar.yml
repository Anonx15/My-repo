name: Build Ironbar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm base-devel rust git gtk4 gtk4-layer-shell dconf clang lld

    - name: Clone latest stable release
      run: |
        REMOTE_URL="https://github.com/JakeStanger/ironbar.git"
        LATEST_STABLE=$(git ls-remote --tags --refs $REMOTE_URL | awk -F/ '{print $3}' | sort -V | tail -n 1)
        echo "Found Latest Stable Tag: $LATEST_STABLE"
        git clone --depth 1 --branch "$LATEST_STABLE" $REMOTE_URL .

    - name: Configure Cargo and optimizations
      run: |
        mkdir -p .cargo
        cat << 'EOF' > .cargo/config.toml
        [target.x86_64-unknown-linux-gnu]
        linker = "clang"
        rustflags = [
            "-C", "target-cpu=bdver2",
            "-C", "remap-path-prefix==",
            "-Clinker-plugin-lto",
            "-Clink-arg=-fuse-ld=lld",           
            "-Clink-arg=-flto=full",              
            "-Clink-arg=-Wl,--icf=safe",          
            "-Clink-arg=-Wl,--gc-sections",       
            "-Clink-arg=-Wl,--as-needed",
            "-Clink-arg=-Wl,-z,now",
            "-Clink-arg=-Wl,-z,relro",
            "-Clink-arg=-Wl,-z,pack-relative-relocs",
            "-Clink-arg=-Wl,-O2"                  
        ]

        [profile.release]
        opt-level = "z"
        codegen-units = 1
        panic = "abort"
        strip = true
        debug = false

        [profile.release.package."*"]
        opt-level = 3
        EOF

    - name: Build binary
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu --no-default-features --features "cli ipc clock label launcher script custom sys_info workspaces+sway"

    - name: Inspect binary size
      run: |
        ls -lh target/x86_64-unknown-linux-gnu/release/ironbar
        echo "----------------------------------------"
        du -b target/x86_64-unknown-linux-gnu/release/ironbar || du -s target/x86_64-unknown-linux-gnu/release/ironbar
        echo "----------------------------------------"
        file target/x86_64-unknown-linux-gnu/release/ironbar

    - name: Upload optimized binary
      uses: actions/upload-artifact@v5
      with:
        name: ironbar-bdver2
        path: target/x86_64-unknown-linux-gnu/release/ironbar

name: Build Ghostty RPM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            wget \
            xz \
            tar \
            rpm-build \
            rpmdevtools \
            scdoc \
            gtk4-devel \
            libadwaita-devel \
            gtk4-layer-shell-devel \
            fontconfig-devel \
            harfbuzz-devel \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            gettext \
            blueprint-compiler \
            libxml2-devel \
            glib2-devel \
            pango-devel \
            pkgconf-pkg-config

      - name: Download Zig 0.15.2
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> $GITHUB_PATH

      - name: Checkout Ghostty
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: v1.3.1
          path: ghostty

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Fetch Zig dependencies
        working-directory: ghostty
        run: zig build --fetch

      - name: Build Ghostty
        working-directory: ghostty
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dcpu=bdver2 \
            -Dpie=false \
            -Dfont-backend=fontconfig_freetype \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Drenderer=opengl \
            -fsys=fontconfig \
            -fsys=harfbuzz \
            -fsys=gtk4-layer-shell \
            -p $PWD/output

      - name: Verify build output
        working-directory: ghostty
        run: find output/ -type f | sort

      - name: Create Spec File and Prepare Sources
        run: |
          cp -r ghostty/output ~/rpmbuild/SOURCES/output
          cat << 'EOF' > ~/rpmbuild/SPECS/ghostty.spec
          Name:           ghostty
          Version:        1.3.1
          Release:        1.bdver2%{?dist}
          Summary:        Fast, native, feature-rich terminal emulator
          License:        MIT
          URL:            https://ghostty.org

          Requires:       gtk4
          Requires:       libadwaita
          Requires:       gtk4-layer-shell
          Requires:       fontconfig
          Requires:       harfbuzz
          Requires:       libxkbcommon
          Requires:       wayland-libs-client

          Conflicts:      ghostty

          %global __os_install_post %{nil}
          %global _missing_build_ids_terminate_build 0
          %global debug_package %{nil}

          %description
          Ghostty terminal emulator compiled with ReleaseFast for AMD FX-4320 (bdver2).
          Wayland-only build targeting Sway WM on Fedora 44.

          %install
          install -Dm755 %{_sourcedir}/output/bin/ghostty \
                         %{buildroot}/usr/bin/ghostty

          install -Dm644 %{_sourcedir}/output/share/applications/com.mitchellh.ghostty.desktop \
                         %{buildroot}/usr/share/applications/com.mitchellh.ghostty.desktop

          install -Dm644 %{_sourcedir}/output/share/man/man1/ghostty.1 \
                         %{buildroot}/usr/share/man/man1/ghostty.1

          install -Dm644 %{_sourcedir}/output/share/man/man5/ghostty.5 \
                         %{buildroot}/usr/share/man/man5/ghostty.5

          install -Dm644 %{_sourcedir}/output/share/terminfo/g/ghostty \
                         %{buildroot}/usr/share/terminfo/g/ghostty

          cp -r %{_sourcedir}/output/share/icons \
                %{buildroot}/usr/share/icons

          cp -r %{_sourcedir}/output/share/ghostty \
                %{buildroot}/usr/share/ghostty

          %files
          %attr(755, root, root) /usr/bin/ghostty
          /usr/share/applications/com.mitchellh.ghostty.desktop
          /usr/share/man/man1/ghostty.1
          /usr/share/man/man5/ghostty.5
          /usr/share/terminfo/g/ghostty
          /usr/share/icons/
          /usr/share/ghostty/

          %post
          tic -x /usr/share/terminfo/g/ghostty 2>/dev/null || true
          update-desktop-database /usr/share/applications 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true

          %postun
          update-desktop-database /usr/share/applications 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true

          %changelog
          * Thu May 15 2025 GitHub Actions <actions@github.com> - 1.3.1-1
          - ReleaseFast build for AMD FX-4320 (bdver2)
          - Wayland-only, Sway WM optimized
          - Font backend: fontconfig_freetype
          - Renderer: OpenGL
          EOF

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            ~/rpmbuild/SPECS/ghostty.spec

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-1.3.1-fc44.rpm
          path: ~/rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 30

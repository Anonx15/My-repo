name: Build Ghostty RPM

on:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.15.2"
  GHOSTTY_VERSION: "1.3.1"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Checkout workflow repo (Spec file)
        uses: actions/checkout@v4

      - name: Checkout Ghostty source
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: v${{ env.GHOSTTY_VERSION }}
          path: ghostty

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            wget \
            tar \
            xz \
            scdoc \
            gettext \
            pkgconf-pkg-config \
            gtk4-devel \
            libadwaita-devel \
            gtk4-layer-shell-devel \
            fontconfig-devel \
            harfbuzz-devel \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            pango-devel \
            glib2-devel \
            libxml2-devel \
            blueprint-compiler

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Download and Setup Zig
        run: |
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Fetch Zig dependencies
        working-directory: ghostty
        run: zig build --fetch

      - name: Build Ghostty
        working-directory: ghostty
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dcpu=bdver2 \
            -Dpie=false \
            -Dstrip=true \
            -Dfont-backend=fontconfig_freetype \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Drenderer=opengl \
            -fsys=fontconfig \
            -fsys=harfbuzz \
            -fsys=gtk4-layer-shell \
            -p $PWD/output

      - name: Verify build output
        run: find ghostty/output -type f | sort

      - name: Prepare RPM sources
        run: |
          cp ghostty.spec ~/rpmbuild/SPECS/ghostty.spec
          
          cp -r ghostty/output ~/rpmbuild/SOURCES/output

      - name: Build RPM Package
        run: |
          rpmbuild -bb \
            --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            ~/rpmbuild/SPECS/ghostty.spec

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-${{ env.GHOSTTY_VERSION }}-fc44
          path: /root/rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 7

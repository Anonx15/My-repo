name: Build Ghostty RPM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            wget \
            xz \
            tar \
            rpm-build \
            rpmdevtools \
            scdoc \
            gtk4-devel \
            libadwaita-devel \
            gtk4-layer-shell-devel \
            fontconfig-devel \
            harfbuzz-devel \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            gettext \
            blueprint-compiler \
            libxml2-devel \
            glib2-devel \
            pango-devel \
            pkgconf-pkg-config \
            ncurses

      - name: Download Zig 0.15.2
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> $GITHUB_PATH

      - name: Checkout Ghostty
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: v1.3.1
          path: ghostty

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Fetch Zig dependencies
        working-directory: ghostty
        run: zig build --fetch

      - name: Build Ghostty
        working-directory: ghostty
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dcpu=bdver2 \
            -Dpie=false \
            -Dstrip=true \
            -Dfont-backend=fontconfig_freetype \
            -Dgtk-x11=false \
            -Dgtk-wayland=true \
            -Drenderer=opengl \
            -fsys=fontconfig \
            -fsys=harfbuzz \
            -fsys=gtk4-layer-shell \
            -p $PWD/output

      - name: Show build output structure
        run: find ghostty/output -type f | sort

      - name: Prepare RPM sources (NEW STRUCTURE)
        run: |
          # Copy spec file from Packaging folder
          cp myrepo/Packaging/rpm/ghostty/ghostty.spec ~/rpmbuild/SPECS/ghostty.spec
          
          # Copy custom desktop file
          cp myrepo/Packaging/rpm/ghostty/com.mitchellh.ghostty.desktop ~/rpmbuild/SOURCES/
          
          # Copy build output
          cp -r ghostty/output ~/rpmbuild/SOURCES/output

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            ~/rpmbuild/SPECS/ghostty.spec

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-1.3.1-fc44.rpm
          path: /github/home/rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 30

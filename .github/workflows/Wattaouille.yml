name: Build Optimized Wattaouille

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rustup clang lld

      - name: Initialize Rust Toolchain
        run: |
          rustup default stable

      - name: Configure Cargo Profile and Rustflags
        run: |
          mkdir -p .cargo
          cat << 'EOF' > .cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = [
              "-C", "target-cpu=bdver2",
              "-Clink-arg=-fuse-ld=lld",
              "-Clink-arg=-Wl,--as-needed",
              "-Clink-arg=-Wl,-O2"
          ]
          
          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = true
          EOF

      - name: Build Binary
        run: |
          cargo build --release --locked

      - name: Upload Optimized Binary
        uses: actions/upload-artifact@v6
        with:
          name: wattaouille-bdver2
          path: target/release/wattaouille

name: Build Optimized Wattaouille

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rustup clang lld git awk

      - name: Initialize Rust Toolchain
        run: |
          rustup default stable

      - name: Clone Latest Stable Wattaouille
        run: |
          REMOTE_URL="https://github.com/wdes/wattaouille.git"
          LATEST_STABLE=$(git ls-remote --tags --refs $REMOTE_URL | awk -F/ '{print $3}' | sort -V | tail -n 1)
          echo "Found Latest Stable Tag: $LATEST_STABLE"
          git clone --depth 1 --branch "$LATEST_STABLE" $REMOTE_URL .

      - name: Configure Cargo Profile and Rustflags
        run: |
          mkdir -p .cargo
          cat << 'EOF' > .cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = [
              "-C", "target-cpu=bdver2",
              "-Clink-arg=-fuse-ld=lld",
              "-Clink-arg=-Wl,--as-needed",
              "-Clink-arg=-Wl,-O2"
          ]
          
          [profile.release]
          opt-level = 3
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = true
          EOF

      - name: Build Binary
        run: |
          cargo build --release --locked

      - name: Upload Optimized Binary
        uses: actions/upload-artifact@v6
        with:
          name: wattaouille-bdver2
          path: target/release/wattaouille

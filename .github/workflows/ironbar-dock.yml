name: Build ironbar

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=bdver2"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: "abort"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  build:
    name: ironbar release build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      # التصحيح هنا: سحب الكود المصدري لـ ironbar مباشرة من مستودعه الرسمي
      - name: Checkout Ironbar Source Code
        uses: actions/checkout@v5
        with:
          repository: 'JakeStanger/ironbar'
          fetch-depth: 1

      - name: Install Absolute Bare Minimum Build Deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git rust pkgconf \
            gtk4 gtk4-layer-shell libpulse networkmanager

      - name: Cache Cargo Registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Build Hyper-Optimized Binary
        run: |
          cargo build \
            --release \
            --locked \
            --no-default-features \
            --features "ipc,cli,config+toml,clock,workspaces+sway,sys_info,volume,network_manager,notifications,tray,focused"

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: ironbar-sway-fx4320
          path: target/release/ironbar
          retention-days: 15

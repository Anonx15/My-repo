name: Build ironbar
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Install System Toolchain & Unified LLVM Linker
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm base-devel rust git gtk4 gtk4-layer-shell dconf clang lld

    - name: Resolve Latest Stable Tag & Shallow Clone (Optimized)
      run: |
        REMOTE_URL="https://github.com/JakeStanger/ironbar.git"
        LATEST_STABLE=$(git ls-remote --tags --refs $REMOTE_URL | awk -F/ '{print $3}' | sort -V | tail -n 1)
        echo "Found Latest Stable Tag: $LATEST_STABLE"
        git clone --depth 1 --branch "$LATEST_STABLE" $REMOTE_URL .

    - name: Override Cargo Configuration with Pure Rust Optimizations
      run: |
        mkdir -p .cargo
        cat << 'EOF' > .cargo/config.toml
        [target.'cfg(target_arch = "x86_64")']
        linker = "clang"
        rustflags = [
            "-C", "target-cpu=bdver2",
            "-Clinker-plugin-lto",
            "-Clink-arg=-fuse-ld=lld",
            "-Clink-arg=-Wl,--gc-sections",
            "-Clink-arg=-Wl,--as-needed",
            "-Clink-arg=-Wl,-z,now",
            "-Clink-arg=-Wl,-z,relro",
            "-Clink-arg=-Wl,-z,pack-relative-relocs",
            "-Clink-arg=-Wl,-O2"
        ]

        [profile.release]
        opt-level = 3
        codegen-units = 1
        panic = "abort"
        strip = true
        debug = false
        EOF

    - name: Compile Ultra-Lean Binary
      run: |
        cargo build --release --no-default-features --features "cli ipc clock label launcher script custom sys_info workspaces+sway"

    - name: Inspect Binary Properties and Size
      run: |
        echo "=== تفاصيل وحجم الملف الثنائي الناتج ==="
        ls -lh target/release/ironbar
        echo "----------------------------------------"
        du -b target/release/ironbar || du -s target/release/ironbar
        echo "----------------------------------------"
        file target/release/ironbar

    - name: Export Optimized Binary
      uses: actions/upload-artifact@v5
      with:
        name: ironbar-fx4320
        path: target/release/ironbar

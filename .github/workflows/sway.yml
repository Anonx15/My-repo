name: Build Sway + wlroots RPMs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-sway-rpms
  cancel-in-progress: true

# sway 1.12 requires wlroots >=0.20.0 <0.21.0
env:
  WLROOTS_VERSION: "0.20.0"
  WLROOTS_SHA256: 33f52414e1b280839aeb70786f0ae2c9f54e27ad4873108d86270a2f89c4934b
  SWAY_VERSION: "1.12"
  SWAY_SHA256: a7b1becc217433c11c6284d36bcea0687b87b77b0ed26a384565292ec321f2b1

  # Compiler selection — only what meson actually reads for C projects
  CC: clang
  CC_LD: lld

  # === CFLAGS for AMD FX-4320 (Piledriver / bdver2) ===
  #
  # -march=bdver2            : target Piledriver microarchitecture
  # -mprefer-vector-width=128: auto-vectorizer uses 128-bit (Piledriver ALUs are
  #                            128-bit; 256-bit ops split into 2 uops + store bug)
  # -mvzeroupper             : insert VZEROUPPER to avoid AVX→SSE transition penalty
  # -O2                      : balanced optimization (O3 bloats code, hurts 16KB L1)
  # -pipe                    : use pipes not temp files between compiler stages
  # -fstack-protector-strong : canary on functions with buffers (~1% cost)
  # -D_FORTIFY_SOURCE=3      : compile+runtime bounds checking on libc functions
  #                            (level 3 is safe with Clang 22 + glibc 2.43)
  # -fomit-frame-pointer     : free up RBP as general register (bdver2 has only
  #                            16 GPRs; RBP = ~6% of them; measurable on register-
  #                            starved Piledriver). Overrides Fedora's default
  #                            -fno-omit-frame-pointer which is for profiling.
  #
  CFLAGS: >-
    -march=bdver2
    -mprefer-vector-width=128
    -mvzeroupper
    -O2 -pipe
    -fstack-protector-strong
    -D_FORTIFY_SOURCE=3
    -fomit-frame-pointer

  # === LDFLAGS ===
  #
  # -fuse-ld=lld       : LLVM linker (best LTO integration with Clang)
  # -Wl,--as-needed    : skip unused DT_NEEDED (faster startup, less RAM)
  # -Wl,-z,relro       : GOT read-only after relocation (free security)
  # -Wl,-z,now         : eager symbol resolution (free security, sway starts once)
  # -Wl,-O1            : linker layout optimization
  #
  # NOTE: Fedora's %meson macro already injects relro/now/as-needed.
  # Duplicates are harmless — the linker deduplicates them.
  #
  LDFLAGS: >-
    -fuse-ld=lld
    -Wl,--as-needed
    -Wl,-z,relro -Wl,-z,now
    -Wl,-O1

jobs:
  build:
    name: Build Sway and wlroots RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898 # Fedora 44

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Fedora RPM build environment
        uses: ./.github/actions/setup-fedora-rpmbuild
        with:
          install-weak-deps: "false"
          packages: >-
            @development-tools
            meson llvm
            libinput-devel
            pixman-devel libdrm-devel mesa-libgbm-devel
            mesa-libEGL-devel mesa-libGLES-devel libglvnd-devel
            libseat-devel
            libdisplay-info-devel libliftoff-devel
            hwdata-devel
            json-c-devel pcre2-devel
            cairo-devel
            libevdev-devel systemd-devel

      - name: Download source tarballs
        run: |
          wlroots_archive="$HOME/rpmbuild/SOURCES/wlroots-${WLROOTS_VERSION}.tar.gz"
          sway_archive="$HOME/rpmbuild/SOURCES/sway-${SWAY_VERSION}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "${wlroots_archive}" \
            "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/${WLROOTS_VERSION}/downloads/wlroots-${WLROOTS_VERSION}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "${sway_archive}" \
            "https://github.com/swaywm/sway/releases/download/${SWAY_VERSION}/sway-${SWAY_VERSION}.tar.gz"
          echo "${WLROOTS_SHA256}  ${wlroots_archive}" | sha256sum --check --strict
          echo "${SWAY_SHA256}  ${sway_archive}" | sha256sum --check --strict

      - name: Build wlroots RPM
        run: rpmbuild -ba Packaging/rpm/wlroots/wlroots.spec --define "_topdir $HOME/rpmbuild"

      - name: Install wlroots RPMs
        run: |
          shopt -s nullglob
          rpms=(~/rpmbuild/RPMS/x86_64/wlroots-*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "::error::No wlroots RPMs were produced by the build" >&2
            exit 1
          fi
          dnf install -y "${rpms[@]}"

      - name: Build sway RPM
        run: |
          spec="$(find . -name sway.spec -print -quit)"
          if [ -z "$spec" ]; then
            echo "::error::sway.spec not found in repository" >&2
            exit 1
          fi
          rpmbuild -ba "$spec" --define "_topdir $HOME/rpmbuild"

      - name: Upload RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-sway-${{ env.SWAY_VERSION }}-wlroots-${{ env.WLROOTS_VERSION }}-bdver2
          path: |
            /root/rpmbuild/RPMS/x86_64/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          retention-days: 30
